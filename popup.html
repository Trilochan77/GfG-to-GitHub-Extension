<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GfG to GitHub Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>GfG → GitHub</h1>
        <p>Push your solutions instantly</p>
      </div>
    </div>

    <!-- Status banner -->
    <div id="status-banner" class="status-banner hidden"></div>

    <!-- Form -->
    <div class="form">
      <!-- GitHub Token -->
      <div class="field">
        <label for="token" class="label">
          <span class="label-icon">🔑</span>
          GitHub Personal Access Token
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="token"
            class="input"
            placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="eye-btn" id="toggle-token" title="Show/Hide token">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=GfG-to-GitHub-Extension" target="_blank" class="hint-link">
          Generate a token with <code>repo</code> scope ↗
        </a>
      </div>

      <!-- GitHub Username -->
      <div class="field">
        <label for="owner" class="label">
          <span class="label-icon">👤</span>
          GitHub Username
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="owner"
            class="input"
            placeholder="e.g. Trilochan77"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <!-- Repository Name -->
      <div class="field">
        <label for="repo" class="label">
          <span class="label-icon">📁</span>
          Repository Name
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="repo"
            class="input"
            placeholder="e.g. Competitive-Coding-Java-"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <span class="hint">Repository must already exist on GitHub</span>
      </div>

      <!-- Save Button -->
      <button id="save-btn" class="save-btn">
        <span id="save-btn-text">Save Settings</span>
      </button>
    </div>

    <!-- Stats / Info -->
    <div class="info-box">
      <div class="info-row">
        <span class="info-icon">💡</span>
        <span>
          Files are saved as <code>Difficulty/problem-name.ext</code> in your repo
        </span>
      </div>
      <div class="info-row">
        <span class="info-icon">🔒</span>
        <span>Your token is stored locally in Chrome only</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="https://github.com/Trilochan77/GfG-to-GitHub-Extension" target="_blank">
        View on GitHub ↗
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
